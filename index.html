<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/normalize.css" />
    <link rel="stylesheet" href="src/styles/styles.css" />
    <title>Book Tracker</title>
  </head>
  <body>
    <div class="container">
      <h1>📚 Book Tracker</h1>
      <div class="add-book-container">
        <input id="titleInput" type="text" placeholder="Book title" />
        <input id="authorInput" type="text" placeholder="Author" />
        <button onclick="addBook()">Add book</button>
      </div>
      <div class="btn-books-container">
        <button onclick="bookStatus('all')">All</button>
        <button onclick="bookStatus('unread')">Unread</button>
        <button onclick="bookStatus('read')">Read</button>
      </div>
      <div class="book-list-container">
        <ul id="bookList"></ul>
      </div>
    </div>
    <script src="src/script/script.js"></script>
  </body>
</html>
